<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="Description" content="Confirmation page showing your review was received, with total reviews and last modified date">
<meta name="Author" content="Collins Zivanai">

<title>Product Review</title>

<link rel="stylesheet" href="styles/form.css">

<script src="scripts/form.js" defer></script>

</head>

<body>

<header>
<h1>Product Review</h1>
</header>

<main>

<form method="get" action="review.html">

<div class="attributes">

<label for="productName">Product Name*</label>

<select id="productName" name="productName" required>

<option value="" disabled selected>Select a Product...</option>

</select>

</div>


<fieldset class="attributes">

<legend>Overall Rating*</legend>

<div class="rating">

    <div>
            <input type="radio" id="Rating1" name="productRating" value="1" required> 
            <label for="Rating1">☆</label>
    </div>

    <div>
            <input type="radio" id="Rating2" name="productRating" value="2" required>
            <label for="Rating2"> ☆☆</label>
    </div>

    <div>
            <input type="radio" id="Rating3" name="productRating" value="3" required>
            <label for="Rating3"> ☆☆☆</label>
    </div>

    <div>
            <input type="radio" id="Rating4" name="productRating" value="4" required> 
            <label for="Rating4">☆☆☆☆</label>
    </div>

<div>

<input type="radio" id="Rating5" name="productRating" value="5" required>
<label for="Rating5"> ☆☆☆☆☆</label>
</div>
</div>

</fieldset>


<div class="attributes">

<label for="installDate">Date of Installation</label>

<input type="date" id="installDate" name="installDate" required>

</div>


<fieldset class="attributes">

<legend>Useful Features</legend>

<div class="features">

    <div>   
            <input type="checkbox" id="durability" name="productFeatures" value="Durability">
            <label for="durability">Durability</label>
    </div>

    <div>
            <input type="checkbox" id="ease" name="productFeatures" value="Ease of Use">
            <label for="ease">Ease of Use</label>
    </div>

    <div>
            <input type="checkbox" id="performance" name="productFeatures" value="Performance">
            <label for="performance">Performance</label>
    </div>

    <div>
            <input type="checkbox" id="design" name="productFeatures" value="Design">
            <label for="design">Design</label>
    </div>

</div>

</fieldset>


<div class="attributes">

<label for="productReview">Written Review <span class="optional">(Optional)</span></label>

<textarea id="productReview" name="productReview" rows="6"></textarea>

</div>


<div class="attributes">

<label for="username">Your Name <span class="optional">(Optional)</span></label>

<input type="text" id="username" name="username">

</div>


<input type="submit" value="Post Review" class="submit-button">

</form>

</main>

<footer>

<p>&copy;2026 Collins Zivanai</p>

<p id="lastModified"></p>

</footer>

</body>
</html>
